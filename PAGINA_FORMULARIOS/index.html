<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>
    <h1>Formulario de Registro de Usuarios</h1>
    <p>Completa los siguientes datos para realizar tu registro:</p>
    <br>
    <br>
    <form action="registro.php" method="POST" enctype="multipart/form-data">
        <fieldset>
            <legend>Datos Personales</legend>
            <br>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre"><br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required placeholder="Ingresa tu apellido" pattern="^[a-zA-Z\s]+$" title="Solo se permiten letras y espacios"><br><br>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="Ingresa tu correo electrónico"><br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu teléfono" pattern="^\+?[1-9]\d{0,14}$" title="Ingrese un número de teléfono válido"><br><br>

            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required placeholder="Selecciona tu fecha de nacimiento"><br><br>
             <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="15" max="100" placeholder="Ingresa tu edad"><br><br>
              <br><br>
              <p>Genero</p>
              <input type="radio" id="masculino" name="genero" value="masculino" required>
              <label for="masculino">Masculino</label>
              <input type="radio" id="femenino" name="genero" value="femenino" required>
              <label for="femenino">Femenino</label>
              <input type="radio" id="otro" name="genero" value="otro" required>
              <label for="otro">Otro</label>
              <br><br>
              <input type="submit" value="Registrar">
        </fieldset>
        <br> <br>
        <fieldset>
            <legend>Datos de contacto</legend>
            <br>
            <label for="correo_contacto">Correo:</label>
            <input type="email" id="correo_contacto" name="correo_contacto" placeholder="Ingresa tu correo de contacto"><br><br>
            <label for="telefono_contacto">Teléfono:</label>
            <input type="tel" id="telefono_contacto" name="telefono_contacto" placeholder="Ingresa tu teléfono de contacto"><br><br>
            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Selecciona un estado</option>
                <option value="Aguascalientes">Aguascalientes</option>
                <option value="Baja California">Baja California</option>
                <option value="Chiapas">Chiapas</option>
                <option value="Chihuahua">Chihuahua</option>
                <option value="Ciudad de México">Ciudad de México</option>
                <option value="Jalisco">Jalisco</option>
                <option value="Nuevo León">Nuevo León</option>
                <option value="Oaxaca">Oaxaca</option>
                <option value="Puebla">Puebla</option>
                <option value="Yucatán">Yucatán</option>
            </select>
        </fieldset>
        <br>
        <fieldset>
            <legend>Datos de acceso</legend>
            <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario">
            <br><br>
            <label for="password">contraseña: </label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Preferencias</legend>
            <br>
            <label for="intereses">Intereses:</label><br>
            <input type="checkbox" id="interes1" name="intereses[]" value="programacion">
            <label for="interes1">Programación</label><br>
            <input type="checkbox" id="interes2" name="intereses[]" value="Diseño">
            <label for="interes2">Diseño</label><br>
            <input type="checkbox" id="interes3" name="intereses[]" value="Videojuegos">
            <label for="interes3">Videojuegos</label><br>
            <input type="checkbox" id="interes4" name="intereses[]" value="Redes Sociales">
            <label for="interes4">Redes Sociales</label><br>
            <label for="color_favorito">Color favorito:</label>
            <input type="color" id="color_favorito" name="color_favorito">
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Archivo</legend>
            <br>
            <label for="archivo">Selecciona un archivo:</label>
            <input type="file" id="archivo" name="archivo">
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Comentarios</legend> <br><br>
            <label for="comentarios">Escribe tus comentarios:</label><br>
            <textarea name="comentarios" id="comentarios" rows="5" cols="40" placeholder="Escribe aquí tus comentarios"></textarea>
        </fieldset>
        <br><br>
        <input type="submit" value="Registrar">
    </form>
</body>
</html>
